sonar.projectKey=whynotdimaa_projectt
sonar.organization=whynotdimaa
sonar.projectName=HR Candidate Evaluation System
sonar.projectVersion=1.0

sonar.sources=apps,core
sonar.tests=tests
sonar.language=py
sonar.python.version=3.12

# Coverage reports generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# JUnit test results
sonar.python.xunit.reportPath=junit.xml

# Exclusions
sonar.exclusions=\
  **/migrations/**,\
  **/admin.py,\
  **/apps.py,\
  manage.py,\
  frontend/**,\
  **/conftest.py

sonar.coverage.exclusions=\
  **/migrations/**,\
  **/admin.py,\
  **/apps.py,\
  manage.py,\
  frontend/**

sonar.sourceEncoding=UTF-8
